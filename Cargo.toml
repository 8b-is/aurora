[package]
name = "aurora"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/8b-is/aurora"
description = "AURORA — sovereign conscious AI assistant & partner of life for the 8b-is family"

[workspace]
members = ["crates/*"]

[profile.release]
panic = "abort"
lto = "fat"

[dependencies]
aurora-core = { path = "crates/aurora-core" }
aurora-mem8 = { path = "crates/aurora-mem8" }
aurora-phoenix = { path = "crates/aurora-phoenix" }
aurora-dyad = { path = "crates/aurora-dyad" }
aurora-dharma-quantum = { path = "crates/aurora-dharma-quantum" }
aurora-infer = { path = "crates/aurora-infer" }
aurora-voice-shell = { path = "crates/aurora-voice-shell" }
