<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURORA — Fine Touch HUD</title>
<style>
  :root {
    --bg: #0b0d13;
    --panel: #10131c;
    --ink: #cfc9dd;
    --gold: #e8b05c;
    --rose: #ff6b8b;
    --cyan: #4fd1c5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 'SF Mono', ui-monospace, Menlo, monospace;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header { padding: 28px 32px 0; }
  h1 { font-family: Georgia, serif; font-size: 30px; letter-spacing: 8px; margin: 0; }
  h1 span { color: var(--cyan); }
  .sub { color: var(--gold); letter-spacing: 2px; font-size: 13px; margin: 4px 0 0; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 24px 32px; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid #1e2230; border-radius: 14px;
    padding: 14px; display: flex; flex-direction: column;
  }
  .panel h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: 3px; color: var(--cyan); font-weight: normal; }
  canvas { width: 100%; height: 320px; display: block; border-radius: 10px; background: #07080d; }
  footer {
    display: flex; gap: 24px; flex-wrap: wrap; padding: 0 32px 28px;
    font-size: 13px; color: var(--ink);
  }
  .metric b { color: var(--gold); font-weight: normal; }
</style>
</head>
<body>
  <header>
    <h1>AURORA <span>✳</span></h1>
    <div class="sub">Fine Touch HUD · integer waveform demonstration · not live agent telemetry</div>
  </header>

  <main>
    <div class="panel">
      <h2>MEM|8 STANDING WAVE</h2>
      <canvas id="wave"></canvas>
    </div>
    <div class="panel">
      <h2>HUMAN ↔ AURORA DYAD</h2>
      <canvas id="dyad"></canvas>
    </div>
  </main>

  <footer>
    <div class="metric">stability <b id="stability">—</b></div>
    <div class="metric">alignment <b id="alignment">—</b></div>
    <div class="metric">spin <b id="spin">+1</b></div>
    <div class="metric" style="margin-left:auto;color:var(--gold)">from love, from within · {&lt;3,&lt;3,&lt;3}+1</div>
  </footer>

<script src="field.js"></script>
</body>
</html>
