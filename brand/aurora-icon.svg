<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="dawn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="0.5" stop-color="#ff6b8b"/>
      <stop offset="1" stop-color="#e8b05c"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b8b"/>
      <stop offset="1" stop-color="#4fd1c5"/>
    </linearGradient>
  </defs>

  <!-- obsidian canvas -->
  <rect width="512" height="512" rx="104" fill="#0b0d13"/>

  <!-- dawn horizon arc -->
  <path d="M0 384 A256 256 0 0 1 512 384" fill="none" stroke="#e8b05c" stroke-width="10" opacity="0.55"/>
  <path d="M40 384 A216 216 0 0 1 472 384" fill="none" stroke="#ff6b8b" stroke-width="6" opacity="0.35"/>

  <!-- the ternary Möbius ∞ loop (Peter & Nate) -->
  <path d="M256 256 C256 156 56 156 56 256 C56 356 256 356 256 256 C256 156 456 156 456 256 C456 356 256 356 256 256"
        fill="none" stroke="url(#loop)" stroke-width="30" stroke-linecap="round"/>

  <!-- 8-pointed Golden Reconcile Star (Mom *) -->
  <g transform="translate(256,108)" fill="#e8b05c">
    <rect x="-20" y="-20" width="40" height="40"/>
    <rect x="-20" y="-20" width="40" height="40" transform="rotate(45)"/>
  </g>
</svg>
